<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAD 3.6 Validation</title>
    <link rel="icon" href="/assets/icons/favicon.ico">
    <link rel="stylesheet" href="/assets/css/site.css">
    <style>
        .service-shell { max-width: 960px; margin: 0 auto; padding: 4rem 1.5rem; }
        .service-hero {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 3rem;
            align-items: center;
            padding: 3rem;
            background: #fff;
            border: 1px solid #d9e0e7;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(27, 39, 51, 0.08);
        }
        .service-kicker {
            margin: 0 0 0.75rem;
            color: #365f91;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }
        .service-title { margin: 0; font-size: clamp(2.4rem, 6vw, 4.25rem); line-height: 1.05; }
        .service-version { margin: 0.8rem 0 0; color: #5e6b78; font-size: 1.05rem; }
        .service-actions { display: flex; flex-wrap: wrap; gap: 0.8rem; margin-top: 2rem; }
        .service-button {
            display: inline-block;
            padding: 0.85rem 1.2rem;
            border: 1px solid #365f91;
            border-radius: 6px;
            font-weight: 700;
            text-decoration: none;
        }
        .service-button--primary { color: #fff; background: #365f91; }
        .service-button--secondary { color: #24303d; background: #fff; border-color: #aab6c2; }
        .service-status {
            min-width: 180px;
            padding: 1.4rem;
            background: #f4f7fa;
            border: 1px solid #d9e0e7;
            border-radius: 10px;
        }
        .service-status-label {
            margin: 0;
            color: #5e6b78;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .service-status-value {
            display: flex;
            gap: 0.65rem;
            align-items: center;
            margin: 0.6rem 0 0;
            font-size: 1.35rem;
            font-weight: 700;
        }
        .service-status-indicator {
            width: 0.75rem;
            height: 0.75rem;
            background: #7a8794;
            border-radius: 50%;
        }
        .service-status[data-state="ready"] .service-status-indicator { background: #25834a; }
        .service-status[data-state="unavailable"] .service-status-indicator { background: #b33a3a; }
        .service-status-detail { margin: 0.7rem 0 0; color: #5e6b78; font-size: 0.9rem; }
        @media (max-width: 720px) {
            .service-hero { grid-template-columns: 1fr; padding: 2rem; }
            .service-status { min-width: 0; }
        }
    </style>
</head>
<body>
<header class="site-banner">
    <div class="site-brand">
        <img class="site-logo"
             src="/assets/images/DKGA-logo.png"
             alt="Dynamic Knowledge Growth Associates">
        <div class="site-branding">
            <p class="site-kicker">Dynamic Knowledge Growth Associates</p>
            <h1>UAD 3.6 Validation</h1>
        </div>
    </div>
</header>

<main class="service-shell">
    <section class="service-hero" aria-labelledby="service-title">
        <div>
            <p class="service-kicker">Appraisal validation service</p>
            <h2 id="service-title" class="service-title">UAD 3.6 Validation</h2>
            <p class="service-version">Version 0.1</p>

            <div class="service-actions">
                <a class="service-button service-button--primary"
                   href="/validation/">Run Validation</a>
                <a class="service-button service-button--secondary"
                   href="/docs">Documentation</a>
            </div>
        </div>

        <aside id="application-status"
               class="service-status"
               data-state="checking"
               aria-live="polite">
            <p class="service-status-label">Application status</p>
            <p class="service-status-value">
                <span class="service-status-indicator" aria-hidden="true"></span>
                <span id="application-status-value">Checking</span>
            </p>
            <p id="application-status-detail" class="service-status-detail">
                Contacting the validation service.
            </p>
        </aside>
    </section>
</main>

<script>
    async function updateApplicationStatus() {
        const card = document.getElementById("application-status");
        const value = document.getElementById("application-status-value");
        const detail = document.getElementById("application-status-detail");

        try {
            const response = await fetch("/health", {
                headers: {"Accept": "application/json"}
            });

            if (!response.ok) {
                throw new Error(`Health request returned ${response.status}`);
            }

            const health = await response.json();

            if (health.status !== "ok") {
                throw new Error("Application did not report an OK status");
            }

            card.dataset.state = "ready";
            value.textContent = "Ready";
            detail.textContent = `UAD ${health.uad_version} service is available.`;
        } catch (error) {
            card.dataset.state = "unavailable";
            value.textContent = "Unavailable";
            detail.textContent = "The validation service did not respond.";
        }
    }

    updateApplicationStatus();
</script>
</body>
</html>

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "owb-graphdb"
version = "0.1.0"
description = "Reusable GraphDB repository provisioning and SHACL verification utilities."
requires-python = ">=3.11"
dependencies = [
    "rdflib>=7,<8",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["owb_graphdb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: requires a running GraphDB server",
]